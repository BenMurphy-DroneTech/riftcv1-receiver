CONFIG_USB_DEVICE_MANUFACTURER="Seeed Studio"
CONFIG_USB_DEVICE_PRODUCT="SlimeNRF Receiver XIAO"

CONFIG_LED_RGB_COLOR=y

# The board defaults to the new USB stack for its console; the receiver uses the legacy stack
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n
CONFIG_USB_DEVICE_STACK_NEXT=n

# riftcv1-band's 36-byte frame packets
CONFIG_ESB_MAX_PAYLOAD_LENGTH=40

# rift_imu_rx prints about 90 IMU lines a second: room for them in the log and the USB buffers
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=10
CONFIG_USB_CDC_ACM_RINGBUF_SIZE=4096
